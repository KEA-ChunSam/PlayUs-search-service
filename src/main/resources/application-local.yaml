spring:
  application:
    name: search-service

  data:
    elasticsearch:
      repositories:
        enabled: true

    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: ${SPRING_ELASTIC_SEARCH_URL}
    index : ${SPRING_ELASTIC_SEARCH_INDEX}

  jwt:
    secret: ${JWT_SECRET}

sentry:
  dsn: ${SENTRY_REPOSITORY_DSN}
  environment: ${SENTRY_ENVIRONMENT}
  servername: ${SENTRY_SERVERNAME}
  repository-uri: ${SENTRY_REPOSITORY_URI}

logging:
  config: classpath:logback-spring.xml
  level:
      root: info
      ads.client: debug
      com.client.external: debug
      com.playus.searchservice.domain.common.feign.client: DEBUG

feign:
  user:
    url: http://localhost:8080

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
    instances:
      circuit:
        base-config: default

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

management:
  endpoints:
    web:
      exposure:
        include:
          - health           # 애플리케이션 상태 확인
          - info             # 애플리케이션 정보
          - prometheus       # 메트릭 데이터 노출

  endpoint:
    health:
      show-details: always
