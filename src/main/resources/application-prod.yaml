server:
  forward-headers-strategy: framework  # ALB HTTPS 헤더 인식

spring:
  application:
    name: search-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: 3s

    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: ${SPRING_ELASTIC_SEARCH_URL}
    index: ${SPRING_ELASTIC_SEARCH_INDEX}
    connection-timeout: 30s
    socket-timeout: 60s

  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include:
          - health           # 애플리케이션 상태 확인
          - info             # 애플리케이션 정보
          - prometheus       # 메트릭 데이터 노출

  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_REPOSITORY_DSN}
  environment: ${SENTRY_ENVIRONMENT}
  servername: ${SENTRY_SERVERNAME}
  repository-uri: ${SENTRY_REPOSITORY_URI}

logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    ads.client: debug
    com.client.external: debug
    com.playus.searchservice.domain.common.feign.client: DEBUG

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

feign:
  user:
    url: ${FEIGN_USER_URL}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
      # 검색 서비스 특화 설정
      elasticsearch-config:
        failure-rate-threshold: 60
        slow-call-duration-threshold: 15s
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 15s
    instances:
      elasticsearch:
        base-config: elasticsearch-config
      user-service:
        base-config: default

  # 검색 서비스 Retry 설정
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - feign.FeignException
      elasticsearch-config:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.elasticsearch.client.ResponseException
          - co.elastic.clients.transport.TransportException
    instances:
      elasticsearch:
        base-config: elasticsearch-config
      user-service:
        base-config: default

  # 동시 요청 제어 추가
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 3s
    instances:
      elasticsearch:
        max-concurrent-calls: 15
      user-service:
        max-concurrent-calls: 10

  # 타임아웃 제어 추가
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
      search-config:
        timeout-duration: 15s
    instances:
      elasticsearch:
        base-config: search-config
      user-service:
        base-config: default
