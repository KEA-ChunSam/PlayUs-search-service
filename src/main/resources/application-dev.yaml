server:
  forward-headers-strategy: framework  # ALB HTTPS 헤더 인식

spring:
  application:
    name: search-service

  data:
    elasticsearch:
      repositories:
        enabled: true

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  elasticsearch:
    uris: ${SPRING_ELASTIC_SEARCH_URL}
    index: ${SPRING_ELASTIC_SEARCH_INDEX}
    # Elasticsearch 연결 최적화
    connection-timeout: 30s
    socket-timeout: 60s

  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include:
          - health           # 애플리케이션 상태 확인
          - info             # 애플리케이션 정보
          - prometheus       # 메트릭 데이터 노출

  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_REPOSITORY_DSN}
  environment: ${SENTRY_ENVIRONMENT}
  servername: ${SENTRY_SERVERNAME}
  repository-uri: ${SENTRY_REPOSITORY_URI}

logging:
  config: classpath:logback-spring.xml

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

feign:
  user:
    url: ${USER_SERVICE_URL}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
    instances:
      elasticsearch:
        base-config: default
      user-service:
        base-config: default

  # 검색 서비스 Retry 설정
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.elasticsearch.client.ResponseException
          - feign.FeignException
    instances:
      elasticsearch:
        base-config: default
      user-service:
        base-config: default
